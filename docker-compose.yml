services:
  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-O-AI API}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      OAI_DATABASE_URL: ${OAI_DATABASE_URL:-sqlite:///./data/oai.db}
      OAI_KNOWLEDGE_ROOT: /app/knowledge
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./knowledge:/app/knowledge:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
