services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oai}
      POSTGRES_USER: ${POSTGRES_USER:-oai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oai_local_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - oai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-oai} -d ${POSTGRES_DB:-oai}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-O-AI API}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      OAI_DATABASE_URL: ${OAI_DATABASE_URL:-postgresql+psycopg://oai:oai_local_dev@postgres:5432/oai}
      OAI_KNOWLEDGE_ROOT: /app/knowledge
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./knowledge:/app/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  oai_postgres_data: